<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Are u serious?</title>
<style>
  body {
    margin: 0;
    height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    background: linear-gradient(135deg, #667eea, #764ba2);
    font-family: -apple-system, sans-serif;
    overflow: hidden;
    text-align: center;
  }
  h1 {
    color: white;
    font-size: 2rem;
    margin-bottom: 40px;
    padding: 0 20px;
  }
  .buttons {
    position: relative;
    width: 100%;
    height: 200px;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 20px;
  }
  button {
    border: none;
    border-radius: 12px;
    font-weight: bold;
    cursor: pointer;
    transition: all 0.08s ease;
    padding: 16px 32px;
    font-size: 1.2rem;
  }
  #yes {
    background: #4CAF50;
    color: white;
  }
  #no {
    background: #f44336;
    color: white;
    position: relative;
  }
</style>
</head>
<body>
  <div id="start-cover" style="position:fixed; inset:0; background:#1a1a2e; display:flex; align-items:center; justify-content:center; z-index:2000; color:white; font-size:1.5rem; font-weight:bold; text-align:center; padding:20px; box-sizing:border-box;">
    Tap to start
  </div>
  <h1>Are u serious?</h1>
  <div class="buttons">
    <button id="yes">Yes</button>
    <button id="no">No</button>
  </div>

<script>
  const startCover = document.getElementById('start-cover');
  function goFullscreen() {
    const el = document.documentElement;
    const req = el.requestFullscreen || el.webkitRequestFullscreen || el.mozRequestFullScreen || el.msRequestFullscreen;
    if (req) req.call(el).catch(() => {});
  }
  startCover.addEventListener('click', () => {
    goFullscreen();
    startCover.style.display = 'none';
  }, { once: true });
</script>

<script>
  const yesBtn = document.getElementById('yes');
  const noBtn = document.getElementById('no');
  let yesSize = 1.2;
  let noSize = 1.2;
  let clicks = 0;
  const maxClicks = 8;
  let answered = false;

  // Warn before leaving the tab (closing, refreshing) until Yes is tapped
  window.addEventListener('beforeunload', (e) => {
    if (!answered) {
      e.preventDefault();
      e.returnValue = '';
    }
  });

  // Block the back button by trapping it in history
  history.pushState(null, '', location.href);
  window.addEventListener('popstate', () => {
    if (!answered) {
      history.pushState(null, '', location.href);
    }
  });

  // Try to go fullscreen on first tap anywhere (browsers require a user gesture)
  function tryFullscreen() {
    const el = document.documentElement;
    if (el.requestFullscreen) el.requestFullscreen().catch(() => {});
    else if (el.webkitRequestFullscreen) el.webkitRequestFullscreen();
  }
  document.body.addEventListener('click', tryFullscreen, { once: true });

  function dodge() {
    if (noSize <= 0) return;
    const maxX = window.innerWidth - noBtn.offsetWidth - 20;
    const maxY = window.innerHeight - noBtn.offsetHeight - 20;
    const x = Math.random() * Math.max(maxX, 10);
    const y = Math.random() * Math.max(maxY, 10);
    noBtn.style.position = 'fixed';
    noBtn.style.left = x + 'px';
    noBtn.style.top = y + 'px';
  }

  function embiggen() {
    clicks++;
    const progress = Math.min(clicks / maxClicks, 1);
    // grow font size up to something huge, and let it fill the screen at the end
    yesSize = 1.2 + progress * 18;
    yesBtn.style.fontSize = yesSize + 'rem';
    yesBtn.style.padding = (16 + yesSize * 4) + 'px ' + (32 + yesSize * 6) + 'px';

    if (progress >= 1) {
      // full screen takeover
      yesBtn.style.position = 'fixed';
      yesBtn.style.inset = '0';
      yesBtn.style.width = '100vw';
      yesBtn.style.height = '100vh';
      yesBtn.style.borderRadius = '0';
      yesBtn.style.fontSize = '4rem';
      yesBtn.style.display = 'flex';
      yesBtn.style.alignItems = 'center';
      yesBtn.style.justifyContent = 'center';
      yesBtn.style.zIndex = '999';
    }
  }

  function eshrinken() {
    noSize = Math.max(noSize - (1.2 / maxClicks), 0);
    if (noSize <= 0.05) {
      noBtn.style.opacity = '0';
      noBtn.style.pointerEvents = 'none';
      return;
    }
    noBtn.style.fontSize = noSize + 'rem';
    noBtn.style.padding = Math.max(16 * noSize, 2) + 'px ' + Math.max(32 * noSize, 4) + 'px';
    noBtn.style.opacity = noSize / 1.2;
  }

  noBtn.addEventListener('click', () => {
    if (noSize <= 0) return;
    embiggen();
    eshrinken();
    dodge();
  });
  noBtn.addEventListener('touchstart', (e) => {
    e.preventDefault();
    if (noSize <= 0) return;
    embiggen();
    eshrinken();
    dodge();
  });

  yesBtn.addEventListener('click', () => {
    answered = true;
    if (document.exitFullscreen) document.exitFullscreen().catch(() => {});
    document.querySelector('h1').style.display = 'none';
    document.querySelector('.buttons').style.display = 'none';
    yesBtn.style.display = 'none';
    document.body.innerHTML += `
